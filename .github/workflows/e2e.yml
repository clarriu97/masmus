name: E2E

# The integration_test flows on real simulators and emulators: the smallest
# current iPhone and the largest, and Android on the oldest supported API
# with a small screen and the newest with a large one. Same commands as
# `tool/ci.sh e2e-ios <size>` / `tool/ci.sh e2e-android` locally. Plus a
# smoke test of the Android release build.
#
# Not run on pull requests: device runs on shared CI machines occasionally
# fail to attach to the app, which says nothing about the code. Before a
# merge, `tool/ci.sh all` runs these flows locally and reports the
# `local-e2e` status that master requires (see docs/RELEASING.md). Here they
# run after every merge, every night, on demand, and for every release tag.

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  ios:
    name: iOS · ${{ matrix.size }}
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        size: [small, large]
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Boots in the background during pub get and the build. Not earlier:
      # booting slows restoring the SDK cache.
      - name: Start simulator
        run: echo "SIM_UDID=$(tool/ci.sh boot-ios ${{ matrix.size }})" >> "$GITHUB_ENV"

      - run: tool/ci.sh e2e-ios ${{ matrix.size }}

  android:
    name: Android · API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest API Flutter supports, on a small 360 × 640 dp screen.
          # Cold boot: installs hang when resuming this image from a snapshot.
          - api-level: 24
            target: default
            profile: Nexus 5
            snapshot: false
          # Newest API, on a large 412 × 915 dp screen; also launches the
          # release (R8) build, which the debug-only e2e flows can't cover.
          - api-level: 35
            target: google_apis
            profile: pixel_7
            snapshot: true
            release-smoke: true
    env:
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=always"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-android"

      # A snapshot only loads on the emulator version that saved it; on any
      # other the emulator cold-boots the cached disk.
      - name: Emulator version
        if: matrix.snapshot
        id: emulator
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator --channel=0 </dev/null >/dev/null
          echo "version=$(sed -n 's/^Pkg.Revision=//p' "$ANDROID_HOME/emulator/source.properties")" >> "$GITHUB_OUTPUT"

      # A booted-emulator snapshot, created once per configuration and
      # emulator version: later runs resume it in seconds instead of
      # cold-booting. Saved right after it is created, before any app is
      # installed: a disk carrying an app signed with another runner's debug
      # key refuses to install this run's build.
      - uses: actions/cache/restore@v6
        if: matrix.snapshot
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.profile }}-emulator-${{ steps.emulator.outputs.version }}

      - name: Create emulator snapshot
        if: matrix.snapshot && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "Snapshot saved."

      - uses: actions/cache/save@v6
        if: matrix.snapshot && steps.avd-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          emulator-options: ${{ matrix.snapshot && '-no-snapshot-save' || '-no-snapshot' }} ${{ env.EMULATOR_OPTIONS }}
          # Turns on "Remove animations": Android runs exercise the static
          # fallbacks, iOS runs the full motion.
          disable-animations: true
          script: tool/ci.sh e2e-android${{ matrix.release-smoke && ' && tool/ci.sh smoke-android-release' || '' }}
