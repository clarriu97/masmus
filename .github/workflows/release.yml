name: Release

# Runs for every version tag (v1.2.3). A release ships only if everything
# passes: the tag matches pubspec.yaml, the checks, the goldens, the release
# builds and the e2e flows on all four CI devices. Then the signed bundle and
# the store listing go to Google Play's internal testing track; promoting a
# version to other tracks is done in Play Console. The App Store upload comes
# with the Apple Developer account.

on:
  push:
    tags: ["v*"]

jobs:
  version:
    name: Tag matches pubspec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec.yaml version $version" >&2
            exit 1
          fi

  checks:
    uses: ./.github/workflows/flutter.yml

  builds:
    uses: ./.github/workflows/builds.yml

  e2e:
    uses: ./.github/workflows/e2e.yml

  play:
    needs: [version, checks, builds, e2e]
    uses: ./.github/workflows/play.yml
    with:
      track: internal
      status: completed
    secrets: inherit
